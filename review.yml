sources:
  - url: https://www.endeavourenergy.com.au/
    type: Website
    note: Corporate site. States service to "2.8 million people in homes and businesses across Central West NSW, the Blue Mountains, Greater Western Sydney, the Southern Highlands, the Illawarra and the South Coast of NSW". No developer, API, open data or CDR section.
  - url: https://data.endeavourenergy.com.au/pages/home/
    type: Portal
    note: Opendatasoft open data portal. Confirmed live 200. Not linked from the corporate site.
  - url: https://data.endeavourenergy.com.au/api-console/explore/v2.1/
    type: APIReference
    note: Interactive API console served by the portal.
  - url: https://www.endeavourenergy.com.au/our-network/resilience-and-emergency-planning/nsw-emergency-backstop-mechanism
    type: Documentation
    note: Names CSIP-AUS and "Endeavour Energy's utility server"; onboarding via the NSW CER Installer Portal capability test. No endpoint published.
  - url: https://www.endeavourenergy.com.au/for-your-home/solar-and-battery-options/flexible-exports
    type: Documentation
    note: Dynamic export limits, inverter "connects to Endeavour Energy over the internet". No standard named on this page, no endpoint.
  - url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    type: Register
    note: Authoritative CDR energy data holder register. 84 brands, all retailers. Endeavour Energy absent.

conclusion: |
  Built, not a stub. One real documented API captured with two harvested OpenAPI
  3.0.3 contracts. Status recorded honestly on every axis: mandate regime none
  (CDR energy considered and ruled out on register evidence), consumer data API
  false, market data open true, access gate self-serve and ungated, data standard
  a vendor open-data platform plus an undocumented CSIP-AUS DER interface. The
  headline for the sector study is that Australia's replicated mandate skipped the
  distribution layer entirely, and the distributor opened its grid data anyway
  without being told to.
