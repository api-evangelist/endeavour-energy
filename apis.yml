name: Endeavour Energy
kind: company
description: 'Endeavour Energy is the regulated electricity distribution network service provider
  (DNSP) for Greater Western Sydney, the Blue Mountains, the Illawarra, the Southern Highlands,
  the South Coast and Central West of New South Wales, Australia, delivering power to around
  2.8 million people over the poles-and-wires network it owns and operates. It sits between
  transmission and retail in the value chain - it moves electricity and hosts the meters,
  but it does not sell energy to consumers, so it holds no retail billing relationship. Its
  API posture is a sharp split. On the market and network side it is genuinely open: a live
  Opendatasoft portal at data.endeavourenergy.com.au serves eight network datasets (poles,
  conductors, distribution districts, other network assets, distribution substation available
  capacity, and live planned/unplanned/single-premise outages) through a documented, anonymous,
  no-key REST Explore API with a downloadable OpenAPI 3.0.3 contract, most of it under the
  Open Database Licence. On the consumer side it is closed and, more importantly, unobligated:
  Australia''s Consumer Data Right was extended to energy, but the designation put the data-holder
  obligation on electricity retailers as primary holders and AEMO as the secondary holder
  and gateway, not on distributors. Endeavour Energy appears nowhere in the 84 brands of the
  CDR energy data holder register, publishes no CDR base URI, and makes no reference to the
  Consumer Data Right anywhere on its corporate site. It does operate a CSIP-AUS (Common Smart
  Inverter Profile - Australia) utility server for NSW flexible exports and the emergency
  backstop mechanism, but that machine interface is device-facing and entirely undocumented
  publicly. The open data portal itself is not linked from the corporate website.'
