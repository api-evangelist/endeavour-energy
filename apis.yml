apis:
- aid: endeavour-energy:endeavour-energy-open-data-explore-api
  name: Endeavour Energy Open Data Explore API
  description: Anonymous, key-free REST API over Endeavour Energy's public network open data
    catalogue, served on the Opendatasoft Explore API v2.1. Exposes eight datasets covering
    distribution network assets (440,728 poles, 808,500 conductor segments, 316,997 other
    network assets, distribution districts), 30,500 records of distribution substation available
    capacity, and live outage feeds (unplanned, planned and single-premise) that refresh roughly
    every ten minutes. Supports dataset search, record query via the Opendatasoft Query Language
    (ODSQL), faceting, per-record lookup, attachments, and bulk export to CSV, Parquet, GPX
    and DCAT. Verified anonymously on 2026-07-27 with HTTP 200 on the catalogue and on records
    with no credential; an optional apikey query parameter exists for authenticated quota.
    Anonymous quota observed at 5,000 calls per day via the x-ratelimit-limit response header.
    Most datasets are published under the Open Database Licence; three carry no declared licence.
  humanURL: https://data.endeavourenergy.com.au/pages/home/
  baseURL: https://data.endeavourenergy.com.au/api/explore/v2.1
