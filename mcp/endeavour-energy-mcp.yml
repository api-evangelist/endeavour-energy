agent_notes:
- Every tool is a GET. Nothing here can mutate, charge or delete; all tools are freely retryable.
- The 5,000/day quota is DOMAIN-wide and shared with every other anonymous consumer. An agent looping
  over query_records will exhaust it for everyone; prefer export_records for anything bulk.
- query_records cannot reach past offset+limit 10000, so the three large asset datasets (808,500 / 440,725
  / 317,031 records) are only fully retrievable via the export tools.
- '`record.fields` is an untyped object in the contract. Call get_dataset first to learn the field schema
  before writing an ODSQL where clause, or the API returns a 400 ODSQLSyntaxError.'
third_party:
- name: '@pipeworx/mcp-opendatasoft'
  url: https://www.npmjs.com/package/@pipeworx/mcp-opendatasoft
  official: false
  note: A community MCP server that targets any public Opendatasoft portal, so it can be pointed at data.endeavourenergy.com.au.
    Unaffiliated with both Endeavour Energy and Opendatasoft; recorded for completeness, not endorsed.
