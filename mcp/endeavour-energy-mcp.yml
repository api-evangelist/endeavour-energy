  source_operation: openapi/endeavour-energy-catalog-api-openapi.yml#listExportFormats
- name: export_catalog
  description: Export the catalogue in a named format.
  source_operation: openapi/endeavour-energy-catalog-api-openapi.yml#exportDatasets
- name: export_catalog_csv
