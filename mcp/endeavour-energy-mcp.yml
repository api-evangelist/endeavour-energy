platform_mcp:
  vendor: Huwise (formerly Opendatasoft), the platform behind data.endeavourenergy.com.au
  endpoint: https://mcp.huwise.com/mcp
  mode: remote
  auth: api-key (X-Domain + X-Apikey headers, or query parameters)
  documented_tools:
  - analyze_catalog
  - search_assets
  - get_asset
  - search_asset_records
  l3: list
  source: https://userguide.huwise.com/en/articles/5071874
  verified: searched
  enabled_for_this_portal: unknown
  note: 'Huwise documents one multi-tenant MCP server that selects a portal through the X-Domain header.
    Its guide says MCP "is not automatically included in your plan", so it is a paid add-on per customer.
    Endeavour Energy neither documents nor advertises it, so we did not call it: these tool names are
    Huwise''s published list, not a live tools/list from this portal.'
