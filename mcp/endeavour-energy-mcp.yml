source: 'Derived from the 16 operations in openapi/endeavour-energy-catalog-api-openapi.yml (7) and openapi/endeavour-energy-dataset-api-openapi.yml
  (9). Searched for an official hosted server first: the npm registry, the corporate site and the data
  portal name none, and Endeavour Energy documents or advertises no MCP endpoint.'
description: 'Endeavour Energy publishes no MCP server. This is a CANDIDATE manifest: one tool per real
  operationId, each inheriting its input contract from the backing operation in the harvested OpenAPI.
  It is a design proposal, not a provider claim, and no tool below has ever been served. The API is unusually
  well suited to one — it is anonymous, read-only, rate-limited and returns JSON, so an MCP server over
  it needs no credential handling and can expose nothing destructive.'
