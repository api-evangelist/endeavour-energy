  description: Export the catalogue as RDF/XML (DCAT / DCAT-AP).
  source_operation: openapi/endeavour-energy-catalog-api-openapi.yml#exportCatalogDCAT
- name: query_records
  description: Query records in one dataset with ODSQL — the workhorse tool. Bounded by limit<=100 and
