  description: Export a whole dataset as CSV.
  source_operation: openapi/endeavour-energy-dataset-api-openapi.yml#exportRecordsCSV
- name: export_records_parquet
  description: Export a whole dataset as Parquet.
  source_operation: openapi/endeavour-energy-dataset-api-openapi.yml#exportRecordsParquet
