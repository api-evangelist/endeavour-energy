generated: '2026-07-27'
method: derived
source: >-
  Derived from the 4xx/5xx responses declared in
  openapi/endeavour-energy-open-data-explore-api-v2-1-openapi.json (identical in
  the v2.0 contract), then enriched with error_code values captured from live
  anonymous requests against
  https://data.endeavourenergy.com.au/api/explore/v2.1 on 2026-07-27.
format: custom-json
rfc9457: false
description: >-
  The Explore API does not use RFC 9457 problem+json. Application errors return
  a flat {error_code, message} object with content-type
  `application/json; charset=utf-8`; the 429 quota response returns a different
  shape with a NUMERIC `errorcode`. Both envelopes are documented below. Every
  one of the 16 operations declares the same 400/401/429/500 set, so the
  problem catalogue is uniform across the whole surface.

envelopes:
  - name: application-error
    applies_to: [400, 404, 500]
    fields:
      error_code: 'string — machine-readable identifier'
      message: 'string — human-readable explanation'
    example: {error_code: ODSQLSyntaxError, message: 'ODSQL syntax exception: unexpected ( at position 5 in BOGUS(. Clause(s) containing the error(s): where.'}
  - name: quota-error
    applies_to: [429]
    fields:
      errorcode: 'number — e.g. 10002'
      error: 'string — human-readable explanation'
      call_limit: 'number — the ceiling that was hit'
      limit_time_unit: 'string — the window, e.g. day'
      reset_time: 'string — ISO 8601 timestamp when the window resets'
    example: {errorcode: 10002, reset_time: '2021-01-26T00:00:00Z', limit_time_unit: day, call_limit: 10000, error: 'Too many requests on the domain. Please contact the domain administrator.'}
    note: >-
      The example value is the one published in the OpenAPI contract. The live
      ceiling observed on this domain is 5,000 per day (X-RateLimit-Limit), not
      10,000.

problems:
  - status: 400
    error_code: ODSQLSyntaxError
    title: Malformed ODSQL query
    detail: >-
      The where / select / group_by / order_by clause could not be parsed. The
      message names the offending token, its character position, and which
      clause contained it.
    remediation: >-
      Fix the ODSQL expression. Field names must exist on the dataset (read them
      from getDataset), string literals use double quotes, and reserved keywords
      must be escaped with backticks.
    verified_live: true
    observed_on: 'GET /catalog/datasets?where=BOGUS('
    source_operation: 'openapi/endeavour-energy-open-data-explore-api-v2-1-openapi.json#components/responses/bad_request'

  - status: 400
    error_code: ODSQLError
    title: Invalid ODSQL expression
    detail: >-
      The query parsed but referenced something that does not exist — an unknown
      ODSQL function, or a field the dataset does not define. Published example:
      "ODSQL query is malformed: invalid_function() Clause(s) containing the
      error(s): select."
    remediation: Use only documented ODSQL functions and fields returned by getDataset.
    verified_live: false
    source_operation: 'openapi/endeavour-energy-open-data-explore-api-v2-1-openapi.json#components/responses/bad_request'

  - status: 404
    error_code: NotFoundResource
    title: Dataset or record not found
    detail: >-
      The dataset_id or record_id does not exist on this domain. Live message:
      "The requested dataset nope-not-a-dataset does not exist."
    remediation: >-
      Enumerate valid ids with getDatasets. Endeavour Energy publishes exactly
      eight — networkassets_otherassets, endeavourenergy_poles,
      conductors_hv_lv_sl_ug, distribution-substation-available-capacity,
      distribution-district, outagecustomerlive,
      single_premise_outage_customer_live, plannedoutagecustomer.
    verified_live: true
    observed_on: 'GET /catalog/datasets/nope-not-a-dataset'
    note: >-
      404 is NOT declared in the OpenAPI contract for any operation — the spec
      lists only 200/400/401/429/500. This is a real, undocumented status. It
      is recorded here because an agent that trusts the spec alone will not
      handle it.
    source_operation: live-probe

  - status: 401
    error_code: null
    title: Unauthorized
    detail: >-
      Returned when a private portal's catalogue is requested without
      authentication. Declared inline on every operation as a bare
      "Unauthorized" description with no response schema.
    remediation: >-
      Not reachable on this domain in normal use — every Endeavour Energy
      dataset is public and every operation was verified 200 anonymously. If it
      appears, supply an API key via `Authorization: Apikey <API_KEY>`.
    verified_live: false
    source_operation: 'openapi/endeavour-energy-open-data-explore-api-v2-1-openapi.json — inline 401 on all 16 operations'

  - status: 429
    error_code: 10002
    title: Too many requests
    detail: >-
      The domain-wide call quota for the window has been exhausted. The body
      carries call_limit, limit_time_unit and reset_time; the response headers
      carry X-RateLimit-Limit / -Remaining / -Reset.
    remediation: >-
      Back off until reset_time (the quota resets daily at 00:00 UTC on this
      domain). The quota is DOMAIN-wide, not per-client — a heavy consumer
      degrades the API for everyone. For bulk needs use the export endpoints
      once rather than paginating.
    verified_live: false
    source_operation: 'openapi/endeavour-energy-open-data-explore-api-v2-1-openapi.json#components/responses/quota'

  - status: 500
    error_code: null
    title: Internal Server Error
    detail: Declared inline on every operation with no response schema.
    remediation: >-
      Retry — every operation is a GET and is safe to replay (see
      conventions/endeavour-energy-conventions.yml). There is no status page and
      no API support channel to escalate to.
    verified_live: false
    source_operation: 'openapi/endeavour-energy-open-data-explore-api-v2-1-openapi.json — inline 500 on all 16 operations'

