cross_cutting_rules:
  auth: None required. Never send an invented apikey value.
  idempotency: All 16 operations are GET — safe and idempotent under RFC 9110, freely retryable.
  rate_limits: 5,000 calls/day, DOMAIN-wide and shared with every other anonymous consumer. Read X-RateLimit-Remaining.
  pagination: limit max 100, offset+limit < 10000 without group_by. Anything larger must use the export
    endpoints.
  errors: '{error_code, message} on 4xx/5xx; a different {errorcode, call_limit, reset_time} shape on
    429. 404 is real but undeclared in the spec.'
  untyped_rows: record.fields is a free-form object in the contract — always call getDataset for the field
    schema before writing an ODSQL where clause.
